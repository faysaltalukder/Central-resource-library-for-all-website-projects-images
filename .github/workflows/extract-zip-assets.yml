name: Extract All ZIP Archives

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "scripts/extract_zip_archives.py"
      - ".github/workflows/extract-zip-assets.yml"

permissions:
  contents: write

concurrency:
  group: zip-extract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract all root ZIP archives and build indexes
        run: python scripts/extract_zip_archives.py

      - name: Commit extracted assets and indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets indexes
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Extract and index ZIP image archives"
            git push
          fi
